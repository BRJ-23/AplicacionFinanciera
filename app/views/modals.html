      <!-- New Goal Modal -->
      <div class="modal-overlay" id="new-goal-modal">

          <div class="modal-form">
            <input type="text" id="new-goal-name" placeholder="Nombre del objetivo (ej: Vacaciones)">

          <div class="modal-form">
            <input type="text" id="edit-goal-name" placeholder="Nombre del fondo">
            <input type="number" id="edit-goal-amount" placeholder="Cantidad objetivo (€)" step="0.01" min="0">

          </div>
          <div class="modal-actions">
            <button onclick="saveEditedGoal()">Guardar</button>
            <button class="btn-cancel" onclick="closeEditGoalModal()">Cancelar</button>
          </div>
        </div>

          <div class="modal-form">
            <input type="text" id="custom-fund-name" placeholder="Nombre (ej: Efectivo, Banco)">

              <input type="checkbox" id="custom-fund-default" style="width: auto;">
              Fondo por defecto (recibe ahorros dinámicos)
            </label>
            <input type="hidden" id="custom-fund-id">
          </div>
          <div class="modal-actions">
            <button onclick="saveCustomFund()">Guardar</button>
            <button class="btn-cancel" onclick="closeCustomFundModal()">Cancelar</button>
          </div>
        </div>

      <!-- New Year Modal -->
      <div class="modal-overlay" id="new-year-modal">

          <div class="modal-form">
            <input type="number" id="new-year-input" placeholder="Ej: 2024" min="2000" max="2100">
          </div>
          <div class="modal-actions">

            <button class="btn-cancel" onclick="closeNewYearModal()">Cancelar</button>
          </div>
        </div>

      <div class="modal-overlay" id="edit-year-modal">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="edit-year-modal-title">

          <div class="modal-form">
            <input type="hidden" id="edit-year-old">
            <input type="number" id="edit-year-input" placeholder="Ej: 2024" min="2000" max="2100">
