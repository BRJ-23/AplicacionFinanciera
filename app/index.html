<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Financy</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <!-- Icon Library -->
  <svg style="display: none;">
    <symbol id="icon-filter-advanced" viewBox="0 0 24 24">
      <line x1="4" y1="6" x2="20" y2="6" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
      <line x1="8" y1="12" x2="16" y2="12" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
      <line x1="11" y1="18" x2="13" y2="18" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
    </symbol>
  </svg>

  <!-- Contenedores ocultos para plantillas y modales -->
  <div id="templates-container"></div>
  <div id="modals-container"></div>

  <!-- Contenedor principal de la aplicación -->
  <div class="container" id="main-app-container" style="opacity: 0; transition: opacity 0.3s ease-in-out;">
    
    <!-- Sidebar -->
    <div id="sidebar-container" style="display: contents;"></div>

    <!-- Tabs Content -->
    <div class="tabs-wrapper" id="tabs-wrapper-container">
      
      <div id="main-dashboard-container" style="display: contents;"></div>

      <!-- Pestañas Mensuales (Se llenan con JavaScript usando el template) -->
      <div id="enero" class="tab-content"></div>
      <div id="febrero" class="tab-content"></div>
      <div id="marzo" class="tab-content"></div>
      <div id="abril" class="tab-content"></div>
      <div id="mayo" class="tab-content"></div>
      <div id="junio" class="tab-content"></div>
      <div id="julio" class="tab-content"></div>
      <div id="agosto" class="tab-content"></div>
      <div id="septiembre" class="tab-content"></div>
      <div id="octubre" class="tab-content"></div>
      <div id="noviembre" class="tab-content"></div>
      <div id="diciembre" class="tab-content"></div>

      <div id="funds-goals-container" style="display: contents;"></div>
      <div id="settings-container" style="display: contents;"></div>
      <div id="year-selection-container" style="display: contents;"></div>
      
    </div>
  </div>

  <script src="renderer.js"></script>
</body>

</html>
